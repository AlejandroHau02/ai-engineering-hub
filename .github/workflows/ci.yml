name: Foundation checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Dry-run preview
        run: python scripts/sync.py --target both --home scratch-home

  desktop-windows:
    name: Desktop (Windows, Tauri + embedded Python)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # build provenance attestation (push only)
      attestations: write
    env:
      TAURI_CLI_VERSION: "2.12.6"
      RUST_TOOLCHAIN: "1.100.0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal; rustup default $env:RUST_TOOLCHAIN
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-cli${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Snapshot managed global paths (before)
        run: python desktop/scripts/home_snapshot.py take "$env:RUNNER_TEMP/home-before.json"
      - name: Stage embedded runtime (pinned SHA-256, clean tree)
        run: python desktop/scripts/stage_runtime.py
      - name: Runtime isolation smoke and desktop Python tests
        run: |
          python -I desktop/scripts/smoke_runtime.py
          python -m unittest tests.test_desktop_runtime tests.test_desktop_portable tests.test_sync_preview tests.test_bound_plan tests.test_catalog tests.test_desktop_contrast -v
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Tauri CLI
        run: |
          $have = if (Get-Command cargo-tauri -ErrorAction SilentlyContinue) { (cargo tauri --version) -replace '^tauri-cli ', '' }
          if ($have -ne $env:TAURI_CLI_VERSION) { cargo install tauri-cli --version "=$env:TAURI_CLI_VERSION" --locked --force }
      - name: Build release and NSIS installer
        working-directory: desktop/src-tauri
        run: cargo tauri build --ci
      - name: Build and verify portable ZIP
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          python desktop/scripts/package_portable.py build --exe desktop/src-tauri/target/release/syncode-desktop.exe --out $dist
          $zip = Get-ChildItem "$dist/*.zip" | Select-Object -First 1
          python desktop/scripts/package_portable.py verify $zip.FullName
          Get-Content "$dist/SHA256SUMS"
          "PORTABLE_ZIP=$($zip.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Portable ZIP — extracted outside the repository, no global Python
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'portable-test'
          Expand-Archive $env:PORTABLE_ZIP -DestinationPath $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          python -I desktop/scripts/smoke_runtime.py --app-root $root.FullName
          $exe = Join-Path $root.FullName 'syncode-desktop.exe'
          $ev = Join-Path $env:RUNNER_TEMP 'evidence'
          $disposable = Join-Path $env:RUNNER_TEMP 'disposable-home'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-diagnostico.png" -Isolated -ExpectText 'Diagnóstico completado'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-sincronizacion.png" -Isolated -Screen sincronizacion -HomeOverride $disposable -ExpectText 'Vista previa: 12 cambios propuestos'
          if (Get-ChildItem $disposable -Force) { throw 'preview wrote into the disposable home' }
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-sincronizacion-home.png" -Isolated -Screen sincronizacion -ExpectText 'Vista previa:'
          # Phase 2B: review → confirm → apply on a disposable home (never the real profile).
          $applyHome = Join-Path $env:RUNNER_TEMP 'apply-home'
          New-Item -ItemType Directory -Force "$applyHome/.claude" | Out-Null
          Set-Content -Encoding utf8 "$applyHome/.claude/CLAUDE.md" '# Personal notes'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-aplicado.png" -Isolated -Screen sincronizacion -HomeOverride $applyHome -Apply -ExpectText 'Cambios aplicados y verificados'
          if (-not (Select-String -Quiet -Path "$applyHome/.claude/CLAUDE.md" -Pattern '# Personal notes')) { throw 'personal content was not preserved' }
          if (-not (Get-ChildItem "$applyHome/.claude" -Filter 'CLAUDE.md.bak.*')) { throw 'no backup of the updated file' }
          $env:USERPROFILE_SAVED = $env:USERPROFILE
          $check = & { $env:USERPROFILE = $applyHome; & "$($root.FullName)/python/python.exe" -I -B "$($root.FullName)/syncode/scripts/sync.py" --preview --target both --format json } | ConvertFrom-Json
          $env:USERPROFILE = $env:USERPROFILE_SAVED
          if ($check.status -ne 'unchanged') { throw "post-apply CLI preview is $($check.status)" }
          # Tampered package: integrity blocks every command before any process starts.
          $tampered = Join-Path $env:RUNNER_TEMP 'portable-tampered'
          Copy-Item -Recurse $root.FullName $tampered
          Add-Content -Path "$tampered/syncode/scripts/transaction.py" -Value '# tampered'
          $tamperHome = Join-Path $env:RUNNER_TEMP 'tamper-home'
          ./desktop/scripts/launch_smoke.ps1 -Exe "$tampered/syncode-desktop.exe" -Out "$ev/portable-integridad.png" -Isolated -HomeOverride $tamperHome -ExpectText 'verificación de integridad'
          if (Get-ChildItem $tamperHome -Force) { throw 'tampered package wrote into the home' }
          $py = "$($root.FullName)/python/python.exe"
          $core = "$($root.FullName)/syncode/scripts"
          function Invoke-Core([string] $HomeDir, [string[]] $Arguments) {
            $saved = $env:USERPROFILE
            try { $env:USERPROFILE = $HomeDir; & $py -I -B @Arguments | ConvertFrom-Json } finally { $env:USERPROFILE = $saved }
          }
          # Phase 3 journey on one disposable home: Doctor → Preview → Apply → verification → Doctor.
          $journey = Join-Path $env:RUNNER_TEMP 'journey-home'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/journey-1-diagnostico.png" -Isolated -HomeOverride $journey -ExpectText 'Diagnóstico completado'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/journey-2-aplicado.png" -Isolated -Screen sincronizacion -HomeOverride $journey -Apply -ExpectText 'Cambios aplicados y verificados'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/journey-3-diagnostico.png" -Isolated -HomeOverride $journey -ExpectText 'sin elementos que requieran revisión'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/journey-4-sin-cambios.png" -Isolated -Screen sincronizacion -HomeOverride $journey -ExpectText 'Vista previa: sin cambios'
          $doctor = Invoke-Core $journey @("$core/doctor.py", '--format', 'json')
          if ($doctor.clients.claude.instructions.status -ne 'current' -or $doctor.clients.codex.instructions.status -ne 'current') { throw 'journey: instructions not current after apply' }
          # Recovery after an abrupt interruption, through the UI.
          $recoverHome = Join-Path $env:RUNNER_TEMP 'recover-home'
          New-Item -ItemType Directory -Force "$recoverHome/.claude" | Out-Null
          Set-Content -NoNewline -Encoding utf8 "$recoverHome/.claude/CLAUDE.md" '# Personal notes'
          $before = Get-FileHash "$recoverHome/.claude/CLAUDE.md"
          & $py -I -B desktop/scripts/stage_interruption.py $core $recoverHome 2
          if ($LASTEXITCODE -ne 3) { throw "interruption was not staged ($LASTEXITCODE)" }
          if (-not (Test-Path "$recoverHome/.ai-engineering-hub-transaction")) { throw 'no pending transaction' }
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-recuperacion.png" -Isolated -HomeOverride $recoverHome -Recover -ExpectText 'Recuperado'
          if ((Get-FileHash "$recoverHome/.claude/CLAUDE.md").Hash -ne $before.Hash) { throw 'recover did not restore the file' }
          if (Test-Path "$recoverHome/.ai-engineering-hub-transaction") { throw 'workspace left after recover' }
          if ((Invoke-Core $recoverHome @("$core/doctor.py", '--format', 'json')).transaction -ne 'clear') { throw 'doctor not clear after recover' }
          # Catálogo (real runner home: read-only) and keyboard/reflow evidence.
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-catalogo.png" -Isolated -Screen catalogo -ExpectText 'Otros elementos instalados'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe -Out "$ev/portable-a11y-estrecho.png" -Isolated -A11yCheck -ExpectText 'Diagnóstico completado'
      - name: NSIS installer — install outside the repository and launch
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'SYNCODE-install'
          Start-Process $setup.FullName -ArgumentList '/S', "/D=$dest" -Wait
          $exe = Get-ChildItem $dest -Filter *.exe | Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          if (-not (Test-Path "$dest/python/python.exe") -or -not (Test-Path "$dest/syncode/scripts/sync.py")) { throw 'bundled runtime missing' }
          $ev = Join-Path $env:RUNNER_TEMP 'evidence'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe.FullName -Out "$ev/diagnostico.png" -ExpectText 'Diagnóstico completado'
          ./desktop/scripts/launch_smoke.ps1 -Exe $exe.FullName -Out "$ev/sincronizacion.png" -Isolated -Screen sincronizacion -ExpectText 'Vista previa:'
          Copy-Item $setup.FullName "$ev/"
      - name: Managed global paths unchanged (after)
        run: |
          python desktop/scripts/home_snapshot.py take "$env:RUNNER_TEMP/home-after.json"
          python desktop/scripts/home_snapshot.py compare "$env:RUNNER_TEMP/home-before.json" "$env:RUNNER_TEMP/home-after.json"
      - name: Executable load configuration (DLL search hardening)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /loadconfig desktop/src-tauri/target/release/syncode-desktop.exe | Select-String -Pattern 'Dependent' 
          & $dumpbin.FullName /dependents desktop/src-tauri/target/release/syncode-desktop.exe | Select-String -Pattern '\.dll'
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        # Provenance only for main and tags, never for feature branches.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          subject-path: |
            ${{ env.PORTABLE_ZIP }}
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncode-desktop-portable
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/SHA256SUMS
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: syncode-desktop-windows
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
