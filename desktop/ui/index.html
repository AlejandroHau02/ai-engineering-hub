<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYNCODE — Diagnóstico</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="3" y="7" width="18" height="7" rx="3.5" class="mark-a"/>
        <rect x="11" y="18" width="18" height="7" rx="3.5" class="mark-b"/>
      </svg>
      <span class="wordmark">SYNCODE</span>
      <span class="tagline">Un mismo criterio. Diferentes inteligencias.</span>
    </div>
  </header>

  <main id="main">
    <div class="page-head">
      <div>
        <h1>Diagnóstico</h1>
        <p class="lede">Estado de SYNCODE en este equipo para Claude Code y Codex. Solo lectura: no modifica archivos ni ejecuta agentes.</p>
      </div>
      <div class="toolbar">
        <button type="button" id="run" class="primary">Volver a diagnosticar</button>
        <label class="toggle"><input type="checkbox" id="show-paths"> Mostrar rutas completas</label>
      </div>
    </div>
    <p class="meta" id="meta"></p>

    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <div id="result" aria-busy="true">
      <section class="panel loading" aria-label="Diagnóstico en curso">
        <span class="spinner" aria-hidden="true"></span>
        <p>Diagnosticando…</p>
      </section>
    </div>
  </main>

  <footer class="appfoot" id="foot">SYNCODE Desktop · prototipo Fase 1</footer>
</body>
</html>
